[workspace]
resolver = "2"
members = ["crates/polypus-crypto", "crates/polypus-prover"]
# The Solana program has its own workspace (programs/Cargo.toml) so that SBF
# builds do not share a lockfile with host-only crates.
exclude = ["programs"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
light-poseidon = "0.4"
sha2 = "0.10"
curve25519-dalek = "4.1"
bech32 = "0.11"
bs58 = "0.5"
thiserror = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
proptest = "1"
anyhow = "1"
