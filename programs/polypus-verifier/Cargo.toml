[package]
name = "polypus-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Reilabs (original gnark-verifier-solana)", "Polypus contributors"]
description = "Groth16 (gnark / Sunspot, BSB22) verifier for Solana via alt_bn128 syscalls. Vendored from Reilabs' gnark-verifier-solana (Apache-2.0)."
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
solana-bn254 = "3.2.1"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
thiserror = "2.0.17"

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = "5.0"

[dev-dependencies]
ark-ec = "0.5"
ark-std = "0.5"
num-bigint = "0.4"
num-traits = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
