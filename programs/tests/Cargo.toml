[package]
name = "polypus-tests"
version = "0.1.0"
description = "LiteSVM host tests for the Polypus programs (load the built .so files)"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "localnet-e2e"
path = "src/bin/localnet_e2e.rs"

[[bin]]
name = "devnet-e2e"
path = "src/bin/devnet_e2e.rs"

[dependencies]
litesvm = "=0.18.1"
# Same requirements as litesvm 0.18.1, so the types unify.
solana-account = "4.3.0"
solana-address = { version = "~2.7.0", features = ["curve25519", "decode"] }
solana-instruction = "~3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-clock = "~3.2.0"
solana-transaction-error = "~3.4.0"
solana-instruction-error = "~2.5.0"

# litesvm 0.18.1 asks for the Agave 4.3 runtime crates with caret requirements,
# but Agave 4.4.0 changed their APIs (they do not follow semver), so pin 4.3.2.
agave-feature-set = "=4.3.2"
agave-reserved-account-keys = "=4.3.2"
solana-bpf-loader-program = "=4.3.2"
solana-builtins = "=4.3.2"
solana-compute-budget = "=4.3.2"
solana-compute-budget-instruction = "=4.3.2"
solana-fee = "=4.3.2"
solana-program-runtime = "=4.3.2"
solana-runtime-transaction = "=4.3.2"
solana-svm-callback = "=4.3.2"
solana-svm-log-collector = "=4.3.2"
solana-svm-timings = "=4.3.2"
solana-syscalls = "=4.3.2"
solana-system-program = "=4.3.2"
solana-transaction-context = "=4.3.2"

polypus-crypto = { path = "../../crates/polypus-crypto" }
polypus-prover = { path = "../../crates/polypus-prover" }

# localnet_e2e binary (RPC client pinned to the same Agave 4.3.2 line as the test runtime crates)
solana-rpc-client = "=4.3.2"
solana-rpc-client-api = "=4.3.2"
solana-transaction-status-client-types = "=4.3.2"
solana-commitment-config = "3.1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
