[package]
name = "polypus-pool"
version = "0.1.0"
description = "Polypus shielded pool (UNAUDITED, DEVNET/LOCALNET ONLY)"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "polypus_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token", "token_2022", "solana-v3"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
polypus-verifier = { path = "../polypus-verifier" }
solana-poseidon = "=5.0.1"
solana-sha256-hasher = "3.1"

[build-dependencies]
polypus-verifier = { path = "../polypus-verifier" }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
polypus-crypto = { path = "../../crates/polypus-crypto" }
hex = "0.4"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
